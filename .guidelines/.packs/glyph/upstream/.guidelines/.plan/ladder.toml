# Glyph ladder — the Rust port and what follows it, one module per step.
#
# Revised from the ladder Opus 5.5 drafted (~/Downloads/ladder.toml, 2026-09-24)
# by the audit in ../.orders/INTAKE-RUST-LADDER.md and the Regent's answers of
# 2026-09-24. `node scripts/ladder.js --check` refuses a cycle, a dangling
# dependency, a premise relied on before it is grounded, and a module marked
# done whose dependencies are not.
#
# status: open · started · done

[meta]
name = "glyph-ladder"
min_after = "M16"
half_max_after = "M21"

# ── premises ─────────────────────────────────────────────────────────────────
[[premise]]
id = "P01"
claim = "The declared corpus (114 snapshot sources, 5 hand-derived goldens, 5 examples), exported whole as the oracle, captures the behaviour worth keeping"
grounded_by = "M01"
if_false = ["M09", "M10a", "M10b", "M10c", "M10d"]

[[premise]]
id = "P02"
claim = "Glyph admits an error-tolerant recursive-descent parser over a lossless tree"
grounded_by = "M02"
if_false = ["M08", "M09", "M12"]

[[premise]]
id = "P03"
claim = "LSP covers the intellisense wanted: diagnostics, completion, hover, signatures, semantic tokens, code actions"
grounded_by = "M03"
if_false = ["M14", "M22"]

[[premise]]
id = "P04"
claim = "The crate graph can be held to the JS core's measured seams mechanically"
grounded_by = "M06"
if_false = ["M07"]

[[premise]]
id = "P05"
claim = "ADRs signed by the Regente and DCs with checks can be enforced at the gate"
grounded_by = "M04"
if_false = ["M18"]

[[premise]]
id = "P06"
claim = "The Rust port can reproduce every diagnostic code one to one"
grounded_by = "M02"
if_false = ["M09"]

[[premise]]
id = "P07"
claim = "The JS engine's performance is measured, so the Rust gains are provable"
grounded_by = "M05"
if_false = ["M11"]

[[premise]]
id = "P08"
claim = "A heuristic trim reaches full recall with zero false drops on golden EMSs"
grounded_by = "M19"
if_false = ["M20"]

[[premise]]
id = "P09"
claim = "A local open model fits the Regente's machine within the latency budget"
grounded_by = "M20"
if_false = ["M20"]

[[premise]]
id = "P10"
claim = "VS Code views are enough for the Explorer"
grounded_by = "M21"
if_false = ["M22"]

[[premise]]
id = "P11"
claim = "Pins plus frontmatter express an EMS without losing intent (the ems.js prototype is not in this repository)"
grounded_by = "M02"
if_false = ["M16"]

